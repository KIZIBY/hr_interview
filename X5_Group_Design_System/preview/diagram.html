<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><title>X5 — Diagram & arrows</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans);color:var(--x5-ink);display:flex;flex-direction:column;gap:16px}
  .row{display:flex;align-items:center;gap:10px}
  .stage{flex:1;padding:14px 16px;border-radius:12px;font-size:13px;font-weight:500;line-height:1.3;text-align:center}
  .arr{color:var(--x5-ink-muted);font-size:18px}
  .a{background:#EFEFF0}
  .b{background:#F3F8FA}
  .c{background:#EBF2D0;color:#0F5A05}
  .d{background:#F5DCFF;color:#50148C}
  .ring{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:999px;background:#303145;color:#fff;font-size:11px;font-weight:500;margin-right:8px}
  h2{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--x5-ink-muted);font-weight:500;margin:0}
</style></head>
<body>
  <h2>Process flow · stage colors + em-dash arrows</h2>
  <div class="row">
    <div class="stage a"><span class="ring">1</span>Запрос</div>
    <span class="arr">→</span>
    <div class="stage b"><span class="ring">2</span>Подбор</div>
    <span class="arr">→</span>
    <div class="stage c"><span class="ring">3</span>Покупка</div>
    <span class="arr">→</span>
    <div class="stage d"><span class="ring">4</span>Доставка</div>
  </div>
</body></html>
