<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><title>X5 — Type display</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:32px;background:#fff;color:var(--x5-ink)}
  .row{display:grid;grid-template-columns:90px 1fr;gap:24px;align-items:baseline;padding:14px 0;border-bottom:1px solid var(--x5-divider)}
  .row:last-child{border:0}
  .meta{font-size:11px;color:var(--x5-ink-quiet);font-variant-numeric:tabular-nums;letter-spacing:.04em;text-transform:uppercase;font-weight:500;line-height:1.2;padding-top:18px}
  .specimen{font-family:var(--font-sans);color:var(--x5-ink)}
</style></head>
<body>
  <div class="row">
    <div class="meta">H1 display<br>72 pt · 96 px</div>
    <div class="specimen" style="font-weight:500;font-size:96px;line-height:.86;letter-spacing:-.02em">AI-агент как единая точка покупок</div>
  </div>
  <div class="row">
    <div class="meta">H1<br>40 pt · 56 px</div>
    <div class="specimen" style="font-weight:500;font-size:56px;line-height:.95;letter-spacing:-.015em">Создаём agentic-commerce платформу</div>
  </div>
  <div class="row">
    <div class="meta">H2<br>28 pt · 36 px</div>
    <div class="specimen" style="font-weight:500;font-size:36px;line-height:1.1">Сущность и перспективы AI-commerce</div>
  </div>
</body></html>
