<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><title>X5 — Diagram accents</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:#fff;display:grid;grid-template-columns:repeat(6,1fr);gap:10px;font-family:var(--font-sans)}
  .swatch{border-radius:10px;overflow:hidden;border:1px solid var(--x5-divider)}
  .chip{height:64px}
  .meta{padding:8px 10px}
  .name{font-size:11px;font-weight:500;color:var(--x5-ink)}
  .hex{font-size:10px;color:var(--x5-ink-quiet);font-variant-numeric:tabular-nums}
  .label{grid-column:1/-1;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--x5-ink-muted);font-weight:500;margin-bottom:-4px}
</style></head>
<body>
  <div class="label">Solid accents · diagrams &amp; emphasis</div>
  <div class="swatch"><div class="chip" style="background:#6CA4C3"></div><div class="meta"><div class="name">Blue</div><div class="hex">#6CA4C3</div></div></div>
  <div class="swatch"><div class="chip" style="background:#94BBD1"></div><div class="meta"><div class="name">Blue soft</div><div class="hex">#94BBD1</div></div></div>
  <div class="swatch"><div class="chip" style="background:#B378D3"></div><div class="meta"><div class="name">Violet</div><div class="hex">#B378D3</div></div></div>
  <div class="swatch"><div class="chip" style="background:#AAC936"></div><div class="meta"><div class="name">Citrus</div><div class="hex">#AAC936</div></div></div>
  <div class="swatch"><div class="chip" style="background:#0F5A05"></div><div class="meta"><div class="name">Grass</div><div class="hex">#0F5A05</div></div></div>
  <div class="swatch"><div class="chip" style="background:#303145"></div><div class="meta"><div class="name">Ink</div><div class="hex">#303145</div></div></div>

  <div class="label">Soft tints · grouping containers &amp; backgrounds</div>
  <div class="swatch"><div class="chip" style="background:#F3F8FA;border-bottom:1px solid var(--x5-divider)"></div><div class="meta"><div class="name">Surface alt</div><div class="hex">#F3F8FA</div></div></div>
  <div class="swatch"><div class="chip" style="background:#EFEFF0"></div><div class="meta"><div class="name">Surface soft</div><div class="hex">#EFEFF0</div></div></div>
  <div class="swatch"><div class="chip" style="background:#F2F2F2"></div><div class="meta"><div class="name">Surface grey</div><div class="hex">#F2F2F2</div></div></div>
  <div class="swatch"><div class="chip" style="background:#F5DCFF"></div><div class="meta"><div class="name">Violet soft</div><div class="hex">#F5DCFF</div></div></div>
  <div class="swatch"><div class="chip" style="background:#EBF2D0"></div><div class="meta"><div class="name">Citrus soft</div><div class="hex">#EBF2D0</div></div></div>
  <div class="swatch"><div class="chip" style="background:#DFE7EC"></div><div class="meta"><div class="name">Divider</div><div class="hex">#DFE7EC</div></div></div>
</body></html>
