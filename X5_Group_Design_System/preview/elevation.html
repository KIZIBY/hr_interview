<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><title>X5 — Elevation</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:32px;background:#F3F8FA;font-family:var(--font-sans);color:var(--x5-ink);display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
  .card{background:#fff;height:90px;border-radius:12px;display:flex;flex-direction:column;justify-content:flex-end;padding:14px}
  .name{font-size:12px;font-weight:500}
  .desc{font-size:10px;color:var(--x5-ink-quiet);font-variant-numeric:tabular-nums}
  .flat{box-shadow:0 1px 0 rgba(48,49,69,.05);border:1px solid var(--x5-divider)}
  .card-sh{box-shadow:0 1px 2px rgba(48,49,69,.06),0 8px 24px rgba(48,49,69,.08)}
  .pop{box-shadow:0 4px 12px rgba(48,49,69,.08),0 24px 48px rgba(48,49,69,.14)}
</style></head>
<body>
  <div class="card flat"><div class="name">Flat</div><div class="desc">hairline · default cards</div></div>
  <div class="card card-sh"><div class="name">Card</div><div class="desc">floating tile / KPI</div></div>
  <div class="card pop"><div class="name">Pop</div><div class="desc">menu, modal</div></div>
</body></html>
