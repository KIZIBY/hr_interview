<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><title>X5 — Badges</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:32px;background:#fff;font-family:var(--font-sans);color:var(--x5-ink);display:flex;flex-wrap:wrap;gap:14px;align-items:center}
  .b{display:inline-flex;align-items:center;height:34px;padding:0 16px;border-radius:999px;font-size:13px;font-weight:500;letter-spacing:.01em}
  .ink{background:#303145;color:#fff}
  .light{background:#fff;color:#303145;border:1px solid var(--x5-divider)}
  .green{background:#0F5A05;color:#fff}
  .citrus{background:#EBF2D0;color:#0F5A05}
  .violet{background:#F5DCFF;color:#50148C}
  .danger{background:#FDE8E7;color:#E52825}
</style></head>
<body>
  <span class="b ink">Апрель 2026</span>
  <span class="b light">Команда #2</span>
  <span class="b green">v 2.1</span>
  <span class="b citrus">Стратегия</span>
  <span class="b violet">AI-commerce</span>
  <span class="b danger">At risk</span>
</body></html>
