<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><title>X5 — ESG palette</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:#fff;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .swatch{border-radius:12px;overflow:hidden;border:1px solid var(--x5-divider)}
  .chip{height:88px}
  .meta{padding:10px 12px}
  .name{font-size:12px;font-weight:500;color:var(--x5-ink)}
  .hex{font-size:11px;color:var(--x5-ink-quiet);font-variant-numeric:tabular-nums}
  .ribbon{grid-column:1/-1;height:54px;border-radius:12px;background:linear-gradient(90deg,#05320A 0%,#0F5A05 35%,#9BC30F 70%,#C3EB91 88%,#EBFFD7 100%)}
  .ribbon-label{grid-column:1/-1;margin-top:-4px;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--x5-ink-muted);font-weight:500}
</style></head>
<body>
  <div class="ribbon"></div>
  <div class="ribbon-label">Growth-Landscape gradient · use ≥ 1 of these on every branded layout</div>
  <div class="swatch"><div class="chip" style="background:#05320A"></div><div class="meta"><div class="name">Dark green</div><div class="hex">#05320A</div></div></div>
  <div class="swatch"><div class="chip" style="background:#0F5A05"></div><div class="meta"><div class="name">Grass</div><div class="hex">#0F5A05</div></div></div>
  <div class="swatch"><div class="chip" style="background:#9BC30F"></div><div class="meta"><div class="name">Olive</div><div class="hex">#9BC30F</div></div></div>
  <div class="swatch"><div class="chip" style="background:#C3EB91"></div><div class="meta"><div class="name">Mint</div><div class="hex">#C3EB91</div></div></div>
</body></html>
