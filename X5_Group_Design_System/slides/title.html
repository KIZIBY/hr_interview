<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><title>X5 — Title slide (3_light)</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#E9EEF3}
  .slide{position:relative;width:1280px;height:720px;box-sizing:border-box;background:#fff;overflow:hidden;font-family:var(--font-sans);color:var(--x5-ink)}
  .wash{position:absolute;inset:auto -120px -200px auto;width:780px;height:780px;
    background:radial-gradient(closest-side,rgba(195,235,145,.55),rgba(155,195,15,.18) 45%,rgba(255,255,255,0) 75%);
    pointer-events:none}
  .inner{position:absolute;left:44px;right:44px;top:64px}
  h1{font-size:120px;line-height:.86;letter-spacing:-.02em;font-weight:500;max-width:1100px;margin:0;position:relative}
  .meta{margin-top:56px;display:flex;flex-direction:column;align-items:flex-start;gap:24px;position:relative}
  .sub{font-size:32px;font-weight:500;color:var(--x5-ink);line-height:1.1}
  .badge{display:inline-flex;align-items:center;height:48px;padding:0 22px;background:var(--x5-logo-mono-ink);color:#fff;border-radius:999px;font-size:18px;font-weight:500}
  .logo{position:absolute;left:44px;bottom:32px;height:36px;z-index:2}
</style></head>
<body>
  <section class="slide" data-screen-label="01 Title">
    <div class="wash"></div>
    <div class="inner">
      <h1>AI-агент как единая точка покупок</h1>
      <div class="meta">
        <div class="sub">Презентация технологическому комитету</div>
        <span class="badge">Апрель 2026</span>
      </div>
    </div>
    <img class="logo" src="../assets/logos/x5-logo-color.svg" alt="X5">
  </section>
</body></html>
