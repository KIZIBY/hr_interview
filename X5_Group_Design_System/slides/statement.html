<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><title>X5 — Statement (11_light)</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#E9EEF3}
  .slide{position:relative;width:1280px;height:720px;box-sizing:border-box;background:#fff;overflow:hidden;font-family:var(--font-sans);color:var(--x5-ink)}
  .body{position:absolute;left:44px;right:44px;top:44px;bottom:80px;display:flex;flex-direction:column}
  .crumb{font-size:13px;font-weight:600;color:var(--x5-ink);margin-bottom:14px}
  .crumb span{color:var(--x5-ink-quiet);font-weight:500}
  .h{margin:auto 0;max-width:1100px}
  .kicker{font-size:14px;font-weight:600;color:var(--x5-grass);margin-bottom:18px}
  h1{font-size:80px;line-height:.92;letter-spacing:-.02em;font-weight:500;margin:0}
  h1 em{font-style:normal;color:var(--x5-grass)}
  .sub{margin-top:24px;font-size:18px;line-height:1.5;color:var(--x5-ink-muted);max-width:880px}
  .footer{position:absolute;left:44px;right:44px;bottom:24px;height:40px;display:flex;align-items:center;justify-content:space-between}
  .footer img{height:24px}
  .footer .pg{font-size:11px;color:var(--x5-ink-quiet);font-variant-numeric:tabular-nums}
</style></head>
<body>
  <section class="slide" data-screen-label="05 Statement">
    <div class="body">
      <div class="h">
        <div class="kicker">Гипотеза</div>
        <h1>Создаём <em>agentic-commerce</em> платформу для покупок в бизнесах Х5 — и не только</h1>
        <p class="sub">Платформа объединяет shoppable-трафик внутри экосистемы Х5 и подключает внешних партнёров через единый API.</p>
      </div>
    </div>
    <div class="footer">
      <img src="../assets/logos/x5-logo-dark.svg" alt="X5">
      <span class="pg">09</span>
    </div>
  </section>
</body></html>
